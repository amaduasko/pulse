<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Pulse, your AI fitness coach: a personal workout plan in one tap, a rest timer, progress tracking and a coach to chat with.">
  <meta name="theme-color" content="#12B886">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pulse">
  <meta property="og:title" content="Pulse: AI fitness coach">
  <meta property="og:description" content="A personal workout plan in one tap, built with Flutter and AI.">
  <meta property="og:image" content="icons/Icon-512.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Pulse: AI fitness coach</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f6fbf8; }
    @media (prefers-color-scheme: dark) { html, body { background: #0f1512; } }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; font: 600 16px system-ui, sans-serif; color: #5c6b64; transition: opacity .3s; }
    #splash img { width: 88px; height: 88px; animation: beat 1.2s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    #splash.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash" role="status"><img src="icons/Icon-192.png" alt=""><span>Loading Pulse…</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
